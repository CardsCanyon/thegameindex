<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · TheGameIndex</title><style>
:root{--bg:#f4f4f1;--ink:#101113;--line:#d9dad6;--orange:#f05a28;--muted:#73777b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Arial,sans-serif}.top{background:#101113;color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;font:12px monospace}.top a{color:var(--orange);text-decoration:none}.wrap{max-width:1100px;margin:30px auto;padding:0 18px}.panel{background:white;border:1px solid var(--line);padding:24px;margin-bottom:20px}.hidden{display:none!important}h1,h2{letter-spacing:-.04em}h1{font-size:32px;margin:0 0 8px}h2{font-size:23px;margin-top:0}.muted{color:var(--muted)}label{display:block;font:11px monospace;text-transform:uppercase;letter-spacing:.04em;margin:15px 0 7px}input,textarea,select{width:100%;border:1px solid #cfd0cc;padding:12px;font:14px Arial;background:#fff;border-radius:0}textarea{min-height:150px;resize:vertical}button,.btn{border:0;background:var(--orange);color:white;padding:12px 16px;font:11px monospace;cursor:pointer;display:inline-block;text-decoration:none}button.secondary,.btn.secondary{background:#ecece7;color:#111}button.danger{background:#a52c22}.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.status{font-size:12px;color:#a12d20;min-height:20px;margin:10px 0}.stories{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.story{border:1px solid var(--line);padding:15px}.story h3{margin:0 0 8px;font-size:18px}.badge{font:10px monospace;background:#eee;padding:5px 7px;display:inline-block;margin-bottom:8px}.badge.published{background:#e1f1e3;color:#24552c}.story p{color:var(--muted);font-size:12px}.story .toolbar{margin-bottom:0}.story .toolbar button{padding:8px 10px}@media(max-width:700px){.row,.stories{grid-template-columns:1fr}.panel{padding:17px}}
</style></head><body><header class="top"><a href="/">← THEGAMEINDEX</a><span>EDITORIAL CMS / ADMIN</span></header><main class="wrap"><section id="login" class="panel" style="max-width:470px;margin:55px auto"><div style="font:11px monospace;color:var(--orange)">PRIVATE AREA</div><h1>Sign in.</h1><p class="muted">Use your configured administrator credentials.</p><form id="loginForm"><label>Email</label><input name="email" type="email" autocomplete="username" required><label>Password</label><input name="password" type="password" autocomplete="current-password" required><div class="status" id="loginStatus"></div><button type="submit">SIGN IN →</button></form></section>
<div id="app" class="hidden"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div><h1>Story manager</h1><p class="muted">Create, edit, save drafts and publish stories to the homepage.</p></div><button class="secondary" id="logout">SIGN OUT</button></div>
<section class="panel"><h2 id="formTitle">Write a story</h2><form id="storyForm"><input type="hidden" name="id"><div class="row"><div><label>Headline *</label><input name="headline" maxlength="220" required></div><div><label>URL slug *</label><input name="slug" maxlength="100" required placeholder="headline-in-url-form"></div></div><div class="row"><div><label>Sport / category *</label><select name="sport"><option>NBA</option><option>NFL</option><option>MLB</option><option>WNBA</option><option>College</option><option>Arizona Sports</option><option>Opinion</option><option>Analysis</option></select></div><div><label>Author</label><input name="author" value="TheGameIndex" maxlength="100"></div></div><label>Thumbnail image URL</label><input name="thumbnail_url" type="url" placeholder="https://…"><label>Short excerpt *</label><textarea name="excerpt" rows="2" maxlength="500" required></textarea><label>Full article body * (plain text; paragraphs separated by blank lines)</label><textarea name="body" required></textarea><div class="row"><div><label>Status</label><select name="status"><option value="draft">Draft — not public</option><option value="published">Published — visible publicly</option></select></div><div style="align-self:end"><div class="toolbar"><button type="submit" id="save">SAVE STORY</button><button type="button" class="secondary" id="clear">NEW STORY / CLEAR</button></div></div></div><div class="status" id="formStatus"></div></form></section>
<section class="panel"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><h2>All stories</h2><button class="secondary" id="refresh">REFRESH</button></div><div id="stories" class="stories"><p class="muted">Loading…</p></div></section></div></main>
<script>
const $=s=>document.querySelector(s),form=$('#storyForm');let items=[];
async function api(url,opts={}){const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'Request failed');return d}
function slugify(s){return s.toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,100)}
form.elements.headline.addEventListener('input',()=>{if(!form.elements.id.value)form.elements.slug.value=slugify(form.elements.headline.value)});
function showApp(){ $('#login').classList.add('hidden');$('#app').classList.remove('hidden');loadStories() }
async function check(){try{const d=await api('/api/session');if(d.authenticated)showApp()}catch{}}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();$('#loginStatus').textContent='Signing in…';const fd=new FormData(e.target);try{await api('/api/login',{method:'POST',body:JSON.stringify({email:fd.get('email'),password:fd.get('password')})});e.target.reset();$('#loginStatus').textContent='';showApp()}catch(err){$('#loginStatus').textContent=err.message}});
function val(o){for(const k of ['id','headline','slug','sport','author','thumbnail_url','excerpt','body','status'])form.elements[k].value=o[k]??'';$('#formTitle').textContent='Edit story';$('#save').textContent='UPDATE STORY';$('#formStatus').textContent='Editing: '+o.headline;window.scrollTo({top:0,behavior:'smooth'})}
function clearForm(){form.reset();form.elements.id.value='';form.elements.author.value='TheGameIndex';form.elements.status.value='draft';$('#formTitle').textContent='Write a story';$('#save').textContent='SAVE STORY';$('#formStatus').textContent=''}
async function loadStories(){try{items=await api('/api/articles');$('#stories').innerHTML=items.length?items.map(a=>'<article class="story"><span class="badge '+a.status+'">'+a.status.toUpperCase()+'</span><h3>'+esc(a.headline)+'</h3><p>'+esc(a.sport)+' · '+esc(a.author)+'<br>Updated '+new Date(a.updated_at).toLocaleString()+'</p><div class="toolbar"><button class="secondary" data-edit="'+a.id+'">EDIT</button>'+(a.status==='published'?'<a class="btn secondary" href="/story/'+encodeURIComponent(a.slug)+'" target="_blank">VIEW</a>':'')+'<button class="danger" data-delete="'+a.id+'">DELETE</button></div></article>').join(''):'<p class="muted">No stories yet. Write your first story above.</p>'}catch(e){$('#stories').innerHTML='<p class="status">'+esc(e.message)+'</p>'}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
form.addEventListener('submit',async e=>{e.preventDefault();$('#formStatus').textContent='Saving…';const d=Object.fromEntries(new FormData(form));const id=d.id;delete d.id;try{const a=await api(id?'/api/articles/'+id:'/api/articles',{method:id?'PUT':'POST',body:JSON.stringify(d)});$('#formStatus').textContent=a.status==='published'?'Published successfully.':'Draft saved.';clearForm();await loadStories()}catch(err){$('#formStatus').textContent=err.message}});
$('#stories').addEventListener('click',async e=>{const edit=e.target.closest('[data-edit]'),del=e.target.closest('[data-delete]');if(edit){const a=items.find(x=>String(x.id)===edit.dataset.edit);if(a)val(a)}if(del){const a=items.find(x=>String(x.id)===del.dataset.delete);if(a&&confirm('Permanently delete “'+a.headline+'”?'))try{await api('/api/articles/'+a.id,{method:'DELETE'});if(form.elements.id.value===String(a.id))clearForm();await loadStories()}catch(err){alert(err.message)}}});
$('#clear').addEventListener('click',clearForm);$('#refresh').addEventListener('click',loadStories);$('#logout').addEventListener('click',async()=>{try{await api('/api/logout',{method:'POST'})}finally{location.reload()}});check();
</script></body></html>
